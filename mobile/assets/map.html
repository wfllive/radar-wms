<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Радар</title>
<style>
*{margin:0;padding:0}
body,html{width:100%;height:100%;overflow:hidden;background:#000}
#map{width:100%;height:100%}
#pin{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;flex-direction:column}
#pin.hide{display:none}
#pin h2{color:#fff;font-size:20px;margin-bottom:8px}
#pin p{color:#888;font-size:12px;margin-bottom:12px;text-align:center;max-width:280px}
#pin input{padding:10px 14px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;font-family:monospace;font-size:12px;width:300px;text-align:center}
#pin button{padding:10px 24px;border-radius:8px;border:none;background:#e94560;color:#fff;font-size:14px;margin-top:10px;cursor:pointer;font-weight:bold}
#pin .try{color:#58a6ff;cursor:pointer;font-size:12px;margin-top:10px}
#bar{position:absolute;top:env(safe-area-inset-top,10px);left:8px;right:8px;z-index:1;display:flex;gap:4px}
#bar select,#bar button{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.82);color:#fff;font-size:14px;backdrop-filter:blur(8px)}
#bar button{cursor:pointer;font-weight:bold;min-width:48px}
#bar button:active{background:rgba(255,255,255,.2)}
#st{font-size:11px;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.82);color:#888;white-space:nowrap}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">
</head>
<body>

<div id="pin">
  <h2>🔑 Токен</h2>
  <p>Скопируйте токен с <b>nowcast.ru/get_token</b><br>и вставьте сюда. Сохранится навсегда.</p>
  <input id="ti" placeholder="eyJleHAiOj...">
  <button id="tb">✔ Готово</button>
  <span class="try" id="ta">попробовать авто</span>
</div>

<div id="bar">
  <select id="ly">
    <option value="bufr_phenomena">Явления</option>
    <option value="bufr_dbz1">dBZ 1км</option>
    <option value="bufr_height">ВГО</option>
    <option value="bufr_zdr1">ZDR</option>
    <option value="bufr_vel1">Доплер</option>
    <option value="bufr_precip">Осадки</option>
    <option value="bufr_summ12">Сумма 12ч</option>
    <option value="nowcast">Наукастинг</option>
    <option value="fmi_open_composite_dbz">FMI</option>
  </select>
  <button id="lk">🔑</button>
  <span id="st"></span>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
<script>
// ===== СОСТОЯНИЕ =====
var token='', layer=document.getElementById('ly').value;
var W='https://www.nowcast.ru/baltrad_wsgi';
var pin=document.getElementById('pin'), st=document.getElementById('st'), ti=document.getElementById('ti');

function S(t,c){st.textContent=t;st.style.color=c||'#888'}

// ===== WMS (только &lt;img&gt;, без CORS) =====
var src=new ol.source.ImageWMS({
  url:W, params:{LAYERS:layer,FORMAT:'image/png',TRANSPARENT:'true'}, ratio:1,
  imageLoadFunction:function(img,s){img.getImage().src=s+(token?'&token='+token:'')}
});
var wms=new ol.layer.Image({opacity:.65,source:src});

new ol.Map({
  layers:[new ol.layer.Tile({source:new ol.source.OSM()}),wms],
  target:'map',
  view:new ol.View({center:ol.proj.fromLonLat([37.4,55.6]),zoom:6})
}).addControl(new ol.control.ZoomSlider());

// ===== ТОКЕН =====
function done(t){
  token=t; pin.classList.add('hide'); ti.value=t; localStorage.setItem('t',t); src.changed();
  try{var j=JSON.parse(atob(t.split('.')[1]));S(new Date(j.exp*1000).toLocaleTimeString('ru-RU'),'#3fb950')}
  catch(e){S('✓','#3fb950')}
}

// 1) localStorage
var saved=localStorage.getItem('t');
if(saved){done(saved)}

// 2) авто (работает в WebView APK, может не работать в браузере)
if(!token){
  fetch('https://www.nowcast.ru/get_token').then(function(r){return r.json()}).then(function(d){
    if(d.token) done(d.token);
  }).catch(function(){}); // silently ignore
}

// ===== КНОПКИ =====
document.getElementById('tb').onclick=function(){var t=ti.value.trim();if(t)done(t)};
ti.onkeydown=function(e){if(e.key==='Enter'){var t=ti.value.trim();if(t)done(t)}};
document.getElementById('ta').onclick=function(){
  fetch('https://www.nowcast.ru/get_token').then(function(r){return r.json()}).then(function(d){
    if(d.token){ti.value=d.token;S('вставьте и нажмите ✔','#d2991d')}else S('не получилось','#d2991d');
  }).catch(function(){S('авто не работает — скопируйте вручную','#d2991d')});
};
document.getElementById('lk').onclick=function(){pin.classList.remove('hide');ti.focus()};
document.getElementById('ly').onchange=function(){layer=this.value;src.updateParams({LAYERS:layer})};
</script>
</body>
</html>
