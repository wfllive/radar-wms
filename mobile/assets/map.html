<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Радар</title>
<style>
*{margin:0;padding:0}
body,html{width:100%;height:100%;overflow:hidden;background:#000}
#map{width:100%;height:100%}
#bar{position:absolute;top:env(safe-area-inset-top,10px);left:8px;right:8px;z-index:1;display:flex;gap:4px;flex-wrap:wrap}
#bar select,#bar input,#bar button{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.82);color:#fff;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bar button{cursor:pointer;font-weight:bold;min-width:48px}
#bar button:active{background:rgba(255,255,255,.2)}
#bar input{font-family:monospace;font-size:11px;flex:1;min-width:120px}
#st{font-size:12px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.82);white-space:nowrap}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">
</head>
<body>

<div id="bar">
  <select id="ly">
    <option value="bufr_phenomena">Явления</option>
    <option value="bufr_dbz1">dBZ 1км</option>
    <option value="bufr_height">Высота ВГО</option>
    <option value="bufr_zdr1">ZDR</option>
    <option value="bufr_vel1">Доплер</option>
    <option value="bufr_precip">Осадки</option>
    <option value="bufr_summ12">Сумма 12ч</option>
    <option value="nowcast">Наукастинг</option>
    <option value="fmi_open_composite_dbz">FMI dBZ</option>
  </select>
  <input id="tk" placeholder="токен..." style="display:none">
  <button id="go" style="display:none">✔</button>
  <span id="st">⏳</span>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
<script>
// ===== КОНФИГ =====
var TOKEN_URL = 'https://www.nowcast.ru/get_token';
var WMS_URL   = 'https://www.nowcast.ru/baltrad_wsgi';
var PROXY     = 'http://localhost:8015';       // только для dev-компьютера

// ===== СОСТОЯНИЕ =====
var token='', layer=document.getElementById('ly').value;
var stEl=document.getElementById('st'), tkEl=document.getElementById('tk'), goEl=document.getElementById('go');

function S(t,c){stEl.textContent=t;stEl.style.color=c||'#3fb950'}

function apply(t){
  token=t; tkEl.value=t; src.changed();
  try{var j=JSON.parse(atob(t.split('.')[1]));S('⏰ '+new Date(j.exp*1000).toLocaleTimeString('ru-RU'),'#3fb950')}
  catch(e){S('✅','#3fb950')}
}

// ===== WMS =====
var src=new ol.source.ImageWMS({
  url:WMS_URL, params:{LAYERS:layer,FORMAT:'image/png',TRANSPARENT:'true'}, ratio:1,
  imageLoadFunction:function(img,s){img.getImage().src=s+(token?'&token='+token:'')}
});
var wms=new ol.layer.Image({opacity:.65,source:src});

new ol.Map({
  layers:[new ol.layer.Tile({source:new ol.source.OSM()}),wms],
  target:'map',
  view:new ol.View({center:ol.proj.fromLonLat([37.4,55.6]),zoom:6})
}).addControl(new ol.control.ZoomSlider());

// ===== ТОКЕН: 3 уровня + детект окружения =====
function isDev(){return location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.protocol==='file:'}

// Уровень 1: прямой fetch (работает в WebView приложения!)
function step1(){
  S('⏳ запрос...','#888');
  fetch(TOKEN_URL).then(function(r){return r.json()}).then(function(d){
    if(d.token){apply(d.token);S('✅','#3fb950');hideInput()}else step2();
  }).catch(function(){step2()});
}

// Уровень 2: прокси (только dev-компьютер)
function step2(){
  if(!isDev()){step3();return}  // на телефоне пропускаем
  var u=PROXY+'/get_token';
  fetch(u).then(function(r){return r.json()}).then(function(d){
    if(d.token){apply(d.token);S('✅ proxy','#3fb950');hideInput()}else step3();
  }).catch(function(){step3()});
}

// Уровень 3: localStorage / ручной ввод
function step3(){
  var saved=localStorage.getItem('t');
  if(saved){apply(saved);S('📦','#3fb950');showInput()}else{showInput();S('🔑 введите токен','#d2991d')}
}

function hideInput(){tkEl.style.display='none';goEl.style.display='none'}
function showInput(){tkEl.style.display='';goEl.style.display=''}

// ===== КНОПКИ =====
goEl.onclick=function(){
  var t=tkEl.value.trim();if(!t)return;localStorage.setItem('t',t);apply(t);hideInput();
};
document.getElementById('ly').onchange=function(){layer=this.value;src.updateParams({LAYERS:layer})};

// ===== СТАРТ =====
step1();
</script>
</body>
</html>
